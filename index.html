<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b38"><meta name="description" content="Shubh Deepawali wishes from Rahul Nahata">
<meta property="og:title" content="Shubh Deepawali"><title>Shubh Deepawali | Rahul Nahata</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#061b38;color:#fff;font-family:Georgia,serif}
main{width:100%;min-height:100svh;display:grid;place-items:center;overflow:hidden}
figure{position:relative;margin:0;width:100vw;height:100svh;overflow:hidden;background:linear-gradient(125deg,#714221 0%,#061b38 53%,#0c2b4a 100%)}
figure img{display:block;width:100%;height:100%;object-fit:fill}
.contact-hotspot{position:absolute;left:59.6%;top:79.3%;width:24.6%;height:8.6%;display:block;border-radius:999px;cursor:pointer}
.contact-hotspot:focus-visible{outline:3px solid white;outline-offset:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.mobile-action{display:none}
@media(max-width:760px){
main{display:flex;flex-direction:column;justify-content:center;min-height:100svh}
figure{width:100%;height:auto;aspect-ratio:1672/941;flex:none}
figure img{height:100%;object-fit:contain}
.contact-hotspot{display:none}
.mobile-action{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px 35px;background:#061b38;width:100%}
.mobile-action .name{color:#f4ca88;font-size:24px}
.mobile-action a{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:12px 24px;border:1.5px solid #f4bc60;border-radius:999px;color:white;background:#07234b;text-decoration:none;font:600 16px system-ui,sans-serif}
}
</style></head><body>
<main><figure>
<img id="approved-artwork" alt="Shubh Deepawali — wishing you joy, prosperity and new beginnings. Rahul Nahata. RSN Group." width="1672" height="941">
<a class="contact-hotspot" href="/contact.vcf" download="Rahul-Nahata-RSN-Group.vcf" aria-label="Let's Stay Connected — download Rahul Nahata's contact"><span class="sr-only">Let's Stay Connected</span></a>
</figure>
<div class="mobile-action"><span class="name">Rahul Nahata</span><a href="/contact.vcf" download="Rahul-Nahata-RSN-Group.vcf">Let's Stay Connected</a></div>
</main>
<script>
(async function(){
  try {
    const paths=Array.from({length:11},(_,i)=>'/assets/artwork-data/part-'+String(i).padStart(2,'0')+'.txt');
    const responses=await Promise.all(paths.map(p=>fetch(p)));
    if(responses.some(r=>!r.ok))throw new Error('Artwork loading failed');
    const b64=(await Promise.all(responses.map(r=>r.text()))).join('').replace(/\s+/g,'');
    const binary=atob(b64),bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    document.getElementById('approved-artwork').src=URL.createObjectURL(new Blob([bytes],{type:'image/webp'}));
  } catch(err) {
    console.error('Unable to display approved Deepawali artwork',err);
    document.querySelector('figure').setAttribute('aria-label','Shubh Deepawali');
  }
})();
</script></body></html>
