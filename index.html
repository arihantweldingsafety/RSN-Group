<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071e42">
  <meta name="description" content="Wishing you a joyful Shubh Deepawali.">
  <meta property="og:title" content="Shubh Deepawali">
  <meta property="og:description" content="Warm wishes for a beautiful Deepawali.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/diwali-blue-desktop.webp">
  <title>Shubh Deepawali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#071f46;--dark:#061834;--gold:#ecc077;--ivory:#fff9eb;}
    *{box-sizing:border-box}
    html{background:var(--dark)}
    body{margin:0;min-height:100svh;background:var(--dark);font-family:'Cormorant Garamond',Georgia,serif}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;white-space:nowrap;clip-path:inset(50%)}
    .desktop{min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .artwork{width:min(100vw,150svh,1600px);aspect-ratio:3/2;position:relative;overflow:hidden;background:var(--navy)}
    .artwork>img{width:100%;height:100%;display:block;object-fit:cover}
    /* Interactive hit area lies exactly over the Save Contact button in the artwork. */
    .save-overlay{position:absolute;left:62%;top:57.5%;width:27.7%;height:11.1%;border-radius:50px;display:block;cursor:pointer;touch-action:manipulation}
    .save-overlay:hover{box-shadow:0 0 25px rgba(255,211,135,.26)}
    .save-overlay:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px #bb8736}
    .mobile{display:none}
    @media(max-width:760px){
      .desktop{display:none}
      .mobile{display:block;min-height:100svh;background:linear-gradient(170deg,#071a36 10%,#0b2f66 90%);color:var(--ivory);text-align:center}
      .mobile-photo{position:relative;overflow:hidden;max-height:48svh;background:#a37d53}
      .mobile-photo img{display:block;width:100%;height:auto;max-height:48svh;object-fit:cover;object-position:center 18%}
      .mobile-photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:25%;background:linear-gradient(transparent,#071f46);pointer-events:none}
      .mobile-message{padding:clamp(17px,5vw,25px) 24px 48px;background:linear-gradient(#071f46,#081a38);position:relative}
      .mobile-message::before{content:"";position:absolute;inset:10px;border:1px solid #c894453d;pointer-events:none}
      .mobile-diya{margin:0 auto 12px;width:44px;height:44px;display:block;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .shubh{font-size:clamp(42px,12vw,70px);font-weight:400;line-height:.93;color:#fff1d2;margin:0}
      .deepawali{font-size:clamp(68px,16vw,106px);font-weight:500;line-height:1.04;letter-spacing:-.045em;margin:0 auto 18px;color:var(--gold)}
      .ornament{display:flex;align-items:center;justify-content:center;gap:13px;margin:0 auto 26px;color:var(--gold)}
      .ornament::before,.ornament::after{content:"";width:64px;border-top:1px solid #ddb16f9e}
      .ornament span{width:8px;height:8px;border:1px solid var(--gold);transform:rotate(45deg)}
      .mobile-save{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:11px 26px;border:1px solid #f1cf92;border-radius:100px;background:linear-gradient(130deg,#fff9e7,#f0cf90);color:#492d11;font:600 16px/1.2 'DM Sans',Arial,sans-serif;text-decoration:none;box-shadow:0 8px 28px #0003;position:relative;touch-action:manipulation}
      .mobile-save svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .mobile-save:hover{background:#fff7e3}
      .mobile-save:focus-visible{outline:3px solid #fff;outline-offset:4px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <h1 class="sr-only">Shubh Deepawali</h1>
  <main>
    <section class="desktop" aria-label="Deepawali greeting">
      <div class="artwork">
        <img src="/assets/diwali-blue-desktop.webp" width="1536" height="1024" fetchpriority="high" alt="An illustrated Deepawali greeting, with a man in traditional attire on the left and Shubh Deepawali wishes on a blue and gold background on the right.">
        <a class="save-overlay" href="/contact.vcf" download="Rahul-Nahata-RSN-Group.vcf" title="Save Contact" aria-label="Save Contact: Rahul Nahata, RSN Group"></a>
      </div>
    </section>
    <section class="mobile" aria-label="Mobile Deepawali greeting">
      <div class="mobile-photo"><img src="/assets/diwali-blue-portrait.webp" width="860" height="945" alt="Cartoon illustration of a man in festive traditional clothing" fetchpriority="high"></div>
      <div class="mobile-message">
        <svg class="mobile-diya" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4c-7 13-10 18-10 26a10 10 0 0 0 20 0C42 22 38 17 32 4Z M8 41c4 11 13 18 24 18s20-7 24-18c-15 6-33 6-48 0Z M12 41q20 7 40 0"/></svg>
        <h2 class="shubh">Shubh</h2>
        <p class="deepawali">Deepawali</p>
        <div class="ornament" aria-hidden="true"><span></span></div>
        <a class="mobile-save" href="/contact.vcf" download="Rahul-Nahata-RSN-Group.vcf" aria-label="Save Contact: Rahul Nahata, RSN Group">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3.2"/><path d="M3 19v-2.1c0-3 2.5-5 6-5 1.8 0 3.3.5 4.4 1.5M18 14v8M14 18h8"/></svg>
          <span>Save Contact</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
