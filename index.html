<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061c40"><meta name="description" content="Shubh Deepawali — warm wishes from Rahul Nahata.">
<meta property="og:title" content="Shubh Deepawali"><meta property="og:description" content="Wishing you joy, prosperity and new beginnings this Deepawali.">
<meta property="og:image" content="/assets/diwali-blue-desktop.webp">
<title>Shubh Deepawali | Rahul Nahata</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#061a38;--navy2:#092d60;--gold:#f5bf65;--ivory:#fff2d4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--navy);color:var(--ivory)}
body{font-family:"Cormorant Garamond",Georgia,serif}
.greeting{min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#071c39}
.panel{position:relative;width:min(100%,1600px);min-height:min(100svh,1000px);display:grid;grid-template-columns:53% 47%;overflow:hidden;background:var(--navy)}
.portrait{position:relative;min-height:750px;overflow:hidden;background:#aa8055}
.portrait img{position:absolute;width:195%;max-width:none;height:100%;object-fit:cover;object-position:left center;left:0;top:0}
.portrait:after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:22%;background:linear-gradient(to right,transparent,#071d40)}
.message{position:relative;display:flex;justify-content:center;align-items:center;text-align:center;min-height:750px;padding:40px 26px;isolation:isolate;background:radial-gradient(ellipse at 45% 40%,#0d2a54 0%,#061b3b 65%,#051731 100%)}
.message:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.12;background-image:radial-gradient(circle at 12% 30%,#e7b15c 0 1px,transparent 2px),radial-gradient(circle at 72% 60%,#ffca80 0 1px,transparent 2px);background-size:97px 97px,153px 153px}
.inner{width:100%;max-width:650px;position:relative;transform:translateY(-1%)}
/* Restore the approved layout's prominent greeting and closer spacing. */
.brand-logo{position:absolute;top:26px;right:28px;width:clamp(86px,10vw,128px);aspect-ratio:1/1;border-radius:50%;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3),0 0 0 3px rgba(245,191,101,.25);background:rgba(255,255,255,.04);backdrop-filter:blur(2px)}
.brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
.diya{display:block;width:82px;height:82px;margin:0 auto 8px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px #dfa63b80)}
h1{font-weight:400;line-height:.85;margin:0;color:#fff2d8;font-size:clamp(63px,6.7vw,106px)}
.deepawali{display:block;font-size:clamp(100px,9.8vw,166px);line-height:1.03;letter-spacing:-.055em;font-weight:500;color:var(--gold);text-shadow:0 4px 18px #f6b9563b;margin:0 auto 9px}
.divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px auto 15px;color:var(--gold)}
.divider:before,.divider:after{content:"";width:20%;height:1px;background:#dfa84995}
.diamond{display:block;width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg)}
.wish{font-size:clamp(23px,2.2vw,32px);line-height:1.3;margin:0 auto 19px;color:#fff1d7;max-width:510px}
.signature{display:flex;align-items:center;justify-content:center;gap:17px;font-size:clamp(27px,2.8vw,38px);letter-spacing:.01em;color:#f5c880;margin:0 auto 13px}
.signature:before,.signature:after{content:"";height:1px;width:34px;background:#f1bd68}
.contact{display:inline-flex;align-items:center;justify-content:center;gap:15px;min-height:72px;padding:11px 27px;border:2px solid #efbb62;border-radius:999px;background:#061b3b;color:white;text-decoration:none;font:500 clamp(16px,1.4vw,22px)/1.15 "DM Sans",Arial,sans-serif;box-shadow:0 0 0 3px #e5a74b17,0 12px 30px #020a16a0;transition:background .2s,transform .2s}
.contact:hover{background:#0f3771;transform:translateY(-2px)}
.contact:focus-visible{outline:3px solid white;outline-offset:6px}
.contact-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:linear-gradient(140deg,#ffda90,#d49a36);color:#08234a}
.contact-icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chevron{font-size:1.4em;color:#f5c16b;line-height:1}
.hang{position:absolute;right:7%;top:0;display:flex;gap:22px;pointer-events:none;color:#e9ab46;opacity:.9}
.hang span{display:block;font-size:34px;padding-top:66px;position:relative}
.hang span:before{content:"";position:absolute;height:65px;width:1px;background:#daa44f;left:50%;top:0}
.hang span:nth-child(2){padding-top:100px}.hang span:nth-child(2):before{height:99px}
.message:after{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;opacity:.35;background:radial-gradient(circle at 84% 76%,#dca64c60 0%,transparent 16%),radial-gradient(circle at 13% 18%,#dca64c42 0%,transparent 15%)}
.mobile-photo{display:none}
@media(min-width:761px) and (max-height:850px){.portrait,.message{min-height:100svh}.message{padding:30px 28px}.brand-logo{top:18px;right:20px;width:88px}.diya{width:49px;height:49px}h1{font-size:clamp(49px,5.5vw,72px)}.deepawali{font-size:clamp(82px,8.2vw,122px)}.wish{font-size:clamp(19px,2vw,25px);margin-bottom:13px}.divider{margin:3px auto 13px}.signature{margin-bottom:12px;font-size:29px}.contact{min-height:60px}}
@media(max-width:760px){
.greeting{display:block}.panel{display:block;min-height:100svh}
.portrait{display:none}.mobile-photo{display:block;position:relative;height:min(47svh,510px);overflow:hidden;background:#b68b5b}
.mobile-photo img.main-art{display:block;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.mobile-photo:after{content:"";position:absolute;left:0;right:0;bottom:0;height:29%;background:linear-gradient(transparent,#071d40)}
.mobile-photo .brand-logo{top:16px;right:16px;width:82px;z-index:2}
.message{min-height:53svh;padding:13px 20px 44px}.inner{max-width:480px}
.diya{width:43px;height:43px;margin-bottom:10px}
h1{font-size:clamp(44px,11vw,64px)}.deepawali{font-size:clamp(75px,16.8vw,112px);margin-bottom:1px}
.divider{margin:0 auto 13px}.wish{font-size:clamp(20px,5.4vw,27px);margin-bottom:16px}
.signature{font-size:clamp(26px,6.5vw,34px);margin-bottom:13px}
.contact{min-height:56px;padding:7px 16px;font-size:clamp(14px,4vw,18px);gap:10px}
.contact-icon{width:40px;height:40px}.contact-icon svg{width:23px;height:23px}.hang{display:none}
.message>.brand-logo{display:none}
}
@media(prefers-reduced-motion:reduce){.contact{transition:none}}



/* Top-right About Us navigation */
.about-nav{position:absolute;top:22px;right:25px;z-index:30;display:inline-flex;align-items:center;justify-content:center;gap:11px;min-height:44px;padding:10px 17px 10px 20px;border:1px solid rgba(246,195,103,.85);border-radius:4px;background:rgba(6,23,49,.94);color:#f5c577;text-decoration:none;text-transform:uppercase;letter-spacing:.14em;font:600 12px/1.1 "DM Sans",Arial,sans-serif;box-shadow:0 8px 25px #0004;backdrop-filter:blur(8px);transition:background .2s,color .2s}
.about-nav:after{content:"↗";font-size:17px;line-height:1;letter-spacing:0}.about-nav:hover{color:#071c39;background:#f5c577}.about-nav:focus-visible{outline:3px solid white;outline-offset:4px}
.hang{right:21%;top:14px}
@media(max-width:760px){.about-nav{top:15px;left:15px;right:auto;padding:10px 13px;min-height:40px;font-size:11px;background:#071c39f2;box-shadow:0 4px 18px #0007}}
</style></head>
<body><main class="greeting"><div class="panel"><a class="about-nav" href="/about.html" aria-label="About RSN Group">About Us</a>
<div class="portrait" aria-hidden="true"><img src="/assets/diwali-blue-desktop.webp" width="1536" height="1024" alt=""></div>
<div class="mobile-photo"><img class="main-art" src="/assets/diwali-blue-portrait.webp" width="860" height="945" alt="Festive cartoon portrait of Rahul Nahata in traditional attire"></div>
<section class="message" aria-label="Deepawali greeting from Rahul Nahata">

<div class="hang" aria-hidden="true"><span>❖</span><span>❖</span></div>
<div class="inner">
<svg class="diya" viewBox="0 0 70 70" aria-hidden="true"><path d="M35 5c-6 10-9 15-9 22a9 9 0 0 0 18 0C44 20 40 15 35 5ZM8 41c5 14 14 21 27 21s22-7 27-21c-15 8-39 8-54 0ZM12 41q23 8 46 0M35 47v6"/></svg>
<h1>Shubh <span class="deepawali">Deepawali</span></h1>
<div class="divider" aria-hidden="true"><span class="diamond"></span></div>
<p class="wish">Wishing you joy, prosperity and<br>new beginnings this Deepawali.</p>
<p class="signature">Rahul Nahata</p>

<a class="contact" href="/contact.vcf" type="text/vcard" aria-label="Let's Stay Connected — save Rahul Nahata's RSN Group contact">
<span class="contact-icon" aria-hidden="true"><svg viewBox="0 0 30 30"><circle cx="11" cy="9" r="4"/><path d="M3 26v-4c0-5 3-8 8-8 2.4 0 4.6.8 6 2.2M23 17v11M17.5 22.5h11"/></svg></span>
<span>Let's Stay Connected</span><span class="chevron" aria-hidden="true">›</span></a>
</div></section></div></main></body></html>
